name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build React Web App & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web Application (React/Vite)
        run: npm run build

      - name: Sync Web assets with Android Project
        run: npx cap sync

      - name: Repair and Refresh Gradle Wrapper
        run: |
          # Download a clean, authentic gradle-wrapper.jar to bypass any corruption/Git LFS issues
          curl -sL https://github.com/gradle/gradle/raw/main/gradle/wrapper/gradle-wrapper.jar -o android/gradle/wrapper/gradle-wrapper.jar
          # Clean any Windows-style carriage returns from the gradlew script
          sed -i -e 's/\r$//' android/gradlew

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Assemble Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: echelon-treasury-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
